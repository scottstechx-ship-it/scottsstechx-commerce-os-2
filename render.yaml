# Render.com one-click deploy for ScottsTechX backend.
# - Uses the included Dockerfile.
# - Connects to a managed Postgres (Render offers free tier).
# - Health check hits /healthz.

services:
  - type: web
    name: scottstechx-api
    runtime: docker
    plan: starter
    # The backend lives in 12_Backend/, not at the repository root. Without
    # these two keys Render looks for ./Dockerfile at the root, which does not
    # exist, and the deploy fails before it starts.
    rootDir: 12_Backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true       # Render auto-generates a secret
      - key: DATABASE_URL
        fromDatabase:
          name: scottstechx-db
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://admin.scottstechx.example
      # AI is optional. Set in the Render dashboard after first deploy.
      - key: AI_PROVIDER
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    autoDeploy: true

databases:
  - name: scottstechx-db
    plan: starter
    databaseName: scottstechx
    user: app
