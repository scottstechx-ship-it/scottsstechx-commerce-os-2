# Railway config — ScottsTechX 12_Backend
# Railway reads this file and provisions the service from the Dockerfile
# in 12_Backend/.
#
# Setup in Railway dashboard:
#   1. New Project -> Deploy from GitHub repo -> scottsxdata-cmyk/scottstechx-commerce-os
#   2. In the service settings, set Root Directory to "12_Backend"
#   3. Click "+ New" -> Database -> Postgres -> it auto-binds DATABASE_URL
#   4. Add these env vars on the API service:
#        NODE_ENV = production
#        JWT_SECRET = <any random 64-char string>
#        PORT = 3001 (default, but explicit is safer)
#   5. Deploy. Railway builds the Dockerfile and gives you a *.up.railway.app URL.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildTarget = "runtime"

[deploy]
startCommand = "node dist/server.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 10
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required env vars (must be set in Railway UI for the service to start):
#   NODE_ENV     = production
#   JWT_SECRET   = <64-char random string>
#   DATABASE_URL = <auto-set by Postgres plugin via reference variable>
#   PORT         = 3001 (Railway sets $PORT automatically; we honor it)
