# Gradle wrapper bootstrap. The actual `gradle-wrapper.jar` is binary and
# must be downloaded by running `gradle wrapper` from a host that has Gradle
# installed, OR by opening the project in Android Studio (which generates it
# automatically on first sync). This file is the pointer to that download.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
