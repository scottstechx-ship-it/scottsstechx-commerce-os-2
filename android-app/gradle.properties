# ScottsTechX Android — Gradle properties
# JVM args sized for typical CI / dev machines; tune locally if you have more RAM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required for the Compose / Material 3 / Lifecycle versions in libs.versions.toml.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Suppress unsupported-compile-sdk warning if a user's Android Studio is older
# than the AGP bundled here. Safe to remove once the team is on a unified toolchain.
android.suppressUnsupportedCompileSdk=34

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
